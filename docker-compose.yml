version: "3.9"

services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: agriadvisor
      POSTGRES_USER: agriadvisor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Port hôte 5434 (et non 5432) pour éviter un conflit avec un Postgres
      # natif déjà installé sur la machine de dev. Les autres services du
      # docker-compose se connectent via `db:5432` (réseau interne), non
      # affecté par ce choix.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  orchestrator:
    build: ./backend/orchestrator
    env_file: .env
    ports:
      - "8000:8000"
    depends_on: [db, redis]

  auth:
    build: ./backend/auth
    env_file: .env
    ports:
      - "8001:8000"
    depends_on: [db]

  agent_agriculture:
    build: ./backend/agent_agriculture
    env_file: .env
    depends_on: [db]

  agent_business:
    build: ./backend/agent_business
    env_file: .env
    depends_on: [db]

  agent_regulation:
    build: ./backend/agent_regulation
    env_file: .env
    depends_on: [db]

  agent_monitoring:
    build: ./backend/agent_monitoring
    env_file: .env
    depends_on: [db, redis]

  marketplace:
    build: ./backend/marketplace
    env_file: .env
    depends_on: [db]

  celery_beat:
    build: ./backend/agent_monitoring
    command: celery -A app beat --loglevel=info
    env_file: .env
    depends_on: [redis, db]

volumes:
  db_data:

<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agri Advisor IA — Conseiller Agricole</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --g900: #14532d;
      --g700: #15803d;
      --g600: #16a34a;
      --g500: #22c55e;
      --g100: #dcfce7;
      --g50: #f0fdf4;
      --a500: #f59e0b;
      --a100: #fef3c7;
      --r600: #dc2626;
      --r100: #fee2e2;
      --s100: #e0f2fe;
      --d900: #111827;
      --d800: #1f2937;
      --d700: #374151;
      --d600: #4b5563;
      --d400: #9ca3af;
      --d200: #e5e7eb;
      --d100: #f3f4f6;
      --d50: #f9fafb;
      --w: #ffffff;
      --sha: 0 4px 16px rgba(0, 0, 0, .13), 0 2px 6px rgba(0, 0, 0, .08);
      --shb: 0 20px 48px rgba(0, 0, 0, .2), 0 8px 16px rgba(0, 0, 0, .10);
      --r: 12px;
      --rs: 8px;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--d900);
      color: var(--d800);
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* PANEL */
    #panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 900;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 32px);
      /* Ensures the whole panel never exceeds the screen height */
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: var(--r);
      box-shadow: var(--sha);
      overflow: hidden;
    }

    #hcard {
      padding: 18px 20px 14px;
      border-top: 4px solid var(--g600);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bicon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--g600), var(--g900));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--d900);
      line-height: 1.2;
    }

    .brand p {
      font-size: 11px;
      color: var(--d400);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    #scard {
      padding: 16px 20px;
    }

    .hint {
      font-size: 13px;
      color: var(--d600);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--d400);
      flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }

    .dot.active {
      background: var(--g500);
    }

    .dot.err {
      background: var(--r600);
      animation: none;
    }

    #pinfo {
      display: none;
    }

    #pid {
      font-size: 11px;
      font-weight: 700;
      color: var(--d400);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 8px;
    }

    .irow {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--d100);
      font-size: 13px;
    }

    .irow:last-child {
      border-bottom: none;
    }

    .ilbl {
      color: var(--d400);
      font-weight: 500;
      flex-shrink: 0;
    }

    .ival {
      color: var(--d800);
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }

    .bg {
      background: var(--g100);
      color: var(--g700);
    }

    .br {
      background: var(--r100);
      color: var(--r600);
    }

    .bd {
      background: var(--d100);
      color: var(--d600);
    }

    #ncard {
      padding: 16px 20px;
      display: none;
    }

    #ncard h3 {
      font-size: 11px;
      font-weight: 700;
      color: var(--d400);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }

    /* NEIGHBOR LIST SCROLLBAR STYLES */
    #nlist {
      max-height: 220px;
      overflow-y: auto;
      padding-right: 6px;
      margin-right: -2px;
      /* Offsets the padding to keep alignment clean */
    }

    #nlist::-webkit-scrollbar {
      width: 4px;
    }

    #nlist::-webkit-scrollbar-track {
      background: transparent;
    }

    #nlist::-webkit-scrollbar-thumb {
      background: var(--d200);
      border-radius: 4px;
    }

    #nlist::-webkit-scrollbar-thumb:hover {
      background: var(--d400);
    }

    .cbar {
      margin-bottom: 9px;
    }

    .cbar-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .cbar-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--d700);
    }

    .cbar-pct {
      font-size: 12px;
      font-weight: 700;
      color: var(--g600);
    }

    .cbar-track {
      height: 6px;
      background: var(--d200);
      border-radius: 99px;
      overflow: hidden;
    }

    .cbar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--g500), var(--g700));
      transition: width .8s cubic-bezier(.4, 0, .2, 1);
    }

    #abtn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: var(--r);
      background: linear-gradient(135deg, var(--g600), var(--g900));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      box-shadow: 0 4px 14px rgba(22, 101, 52, .4);
      font-family: inherit;
    }

    #abtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(22, 101, 52, .5);
    }

    #abtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #abtn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* NDVI HEATMAP TOGGLE */
    #hmbtn {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      border: 1px solid var(--d200);
      border-radius: var(--rs);
      background: var(--w);
      color: var(--d700);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background .15s, border-color .15s, opacity .15s;
      font-family: inherit;
    }

    #hmbtn:hover:not(:disabled) {
      background: var(--d50);
      border-color: var(--d400);
    }

    #hmbtn.on {
      background: var(--g50);
      border-color: var(--g500);
      color: var(--g700);
    }

    #hmbtn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* REPORT SECTIONS */
    .rsec {
      background: var(--d50);
      border-radius: var(--r);
      padding: 20px 22px;
      margin-bottom: 16px;
      border: 1px solid var(--d200);
    }

    .rsh {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .sico {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .ico-s {
      background: #fef3c7;
    }

    .ico-w {
      background: var(--s100);
    }

    .ico-v {
      background: #e0e7ff;
    }

    .ico-c {
      background: var(--g100);
    }

    .ico-x {
      background: var(--r100);
    }

    .ico-n {
      background: var(--d100);
    }

    .stit {
      font-size: 14px;
      font-weight: 700;
      color: var(--d800);
    }

    .ssub {
      font-size: 12px;
      color: var(--d400);
      margin-top: 1px;
    }

    .kvg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .kvi {
      background: var(--w);
      border-radius: var(--rs);
      padding: 12px 14px;
      border: 1px solid var(--d200);
    }

    .kvl {
      font-size: 11px;
      color: var(--d400);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .kvv {
      font-size: 15px;
      font-weight: 700;
      color: var(--d800);
    }

    .kvs {
      font-size: 11px;
      color: var(--d600);
      margin-top: 2px;
    }

    .crec {
      margin-bottom: 12px;
    }

    .crec:last-child {
      margin-bottom: 0;
    }

    .crec-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .crec-n {
      font-size: 14px;
      font-weight: 700;
      color: var(--d800);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .crnk {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--g100);
      color: var(--g700);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crnk.r1 {
      background: #fef3c7;
      color: #b45309;
    }

    .crsc {
      font-size: 13px;
      font-weight: 700;
      color: var(--g700);
    }

    .crrz {
      font-size: 12px;
      color: var(--d400);
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .crt {
      height: 8px;
      background: var(--d200);
      border-radius: 99px;
      overflow: hidden;
    }

    .crf {
      height: 100%;
      border-radius: 99px;
      transition: width 1s cubic-bezier(.4, 0, .2, 1) .3s;
    }

    .fg {
      background: linear-gradient(90deg, #f59e0b, #b45309);
    }

    .fv {
      background: linear-gradient(90deg, var(--g500), var(--g700));
    }

    .fd {
      background: linear-gradient(90deg, var(--d400), var(--d700));
    }

    .sclaim {
      background: var(--w);
      border-left: 3px solid var(--g500);
      border-radius: 0 var(--rs) var(--rs) 0;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--d700);
      line-height: 1.6;
    }

    .witem {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 12px;
      background: var(--r100);
      border-radius: var(--rs);
      margin-bottom: 8px;
      font-size: 13px;
      color: #7f1d1d;
      line-height: 1.5;
    }

    .witem:last-child {
      margin-bottom: 0;
    }

    .prose {
      font-size: 13px;
      color: var(--d600);
      line-height: 1.7;
    }

    .prose strong {
      color: var(--d800);
      font-weight: 700;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="panel">
    <div class="card" id="hcard">
      <div class="brand">
        <div class="bicon">🌾</div>
        <div>
          <h1>Agri Advisor IA</h1>
          <p>Conseiller agronomique intelligent</p>
        </div>
      </div>
    </div>

    <div class="card" id="scard">
      <div id="hintrow" class="hint">
        <div class="dot" id="sdot"></div>
        <span id="stxt">Cliquez sur la carte pour sélectionner une parcelle.</span>
      </div>
      <div id="pinfo">
        <div id="pid"></div>
        <div class="irow"><span class="ilbl">📍 Source</span><span class="ival" id="isrc">—</span></div>
        <div class="irow"><span class="ilbl">🌱 Statut</span><span id="ibadge"></span></div>
        <div class="irow" id="icrow" style="display:none"><span class="ilbl">🌿 Culture</span><span class="ival"
            id="icrp">—</span></div>
        <div class="irow" id="iarow" style="display:none"><span class="ilbl">📐 Surface</span><span class="ival"
            id="iarea">—</span></div>
      </div>
    </div>

    <div class="card" id="ncard">
      <h3 id="ntitle">Cultures voisines</h3>
      <div id="nlist"></div>
    </div>

    <button id="hmbtn">🛰️ Afficher la carte NDVI</button>
    <button id="abtn" disabled>🔍 Obtenir les recommandations</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([46.6, 2.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
    let pl = null, nl = null, sp = null, heatmapLayer = null, heatmapOn = false;
    const sdot = document.getElementById('sdot'), stxt = document.getElementById('stxt'), hrow = document.getElementById('hintrow'),
      pi = document.getElementById('pinfo'), pid = document.getElementById('pid'), isrc = document.getElementById('isrc'),
      ibadge = document.getElementById('ibadge'), icrow = document.getElementById('icrow'), icrp = document.getElementById('icrp'),
      iarow = document.getElementById('iarow'), iarea = document.getElementById('iarea'),
      nc = document.getElementById('ncard'), nt = document.getElementById('ntitle'), nl2 = document.getElementById('nlist'),
      abtn = document.getElementById('abtn'), hmbtn = document.getElementById('hmbtn');

    const SRC = { 'cadastre': 'Cadastre (IGN)', 'rpg': 'RPG (ASP)', 'manual': 'Manuel', 'unresolved': 'Non résolu' };

    function setStatus(t, s = 'idle') { stxt.textContent = t; sdot.className = 'dot' + (s === 'active' ? ' active' : s === 'err' ? ' err' : ''); }
    function badge(cls, txt) { const b = document.createElement('span'); b.className = 'badge ' + cls; b.textContent = txt; return b; }
    function animBars() { requestAnimationFrame(() => document.querySelectorAll('[data-pct]').forEach(e => e.style.width = e.dataset.pct + '%')); }

    function resetHeatmap() {
      if (heatmapLayer) { map.removeLayer(heatmapLayer); heatmapLayer = null; }
      heatmapOn = false;
      hmbtn.classList.remove('on'); hmbtn.textContent = '🛰️ Afficher la carte NDVI'; hmbtn.style.display = 'none'; hmbtn.disabled = false;
    }

    hmbtn.addEventListener('click', async () => {
      if (!sp) return;
      if (heatmapOn) { resetHeatmap(); hmbtn.style.display = 'flex'; return; }
      hmbtn.disabled = true; hmbtn.textContent = '🛰️ Chargement…';
      try {
        const resp = await fetch('/parcel/ndvi_heatmap', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ point: sp, manual_geojson: null }) });
        if (!resp.ok) { const err = await resp.json().catch(() => ({})); hmbtn.textContent = '🛰️ Indisponible'; console.error(err.detail || resp.statusText); setTimeout(() => { hmbtn.textContent = '🛰️ Afficher la carte NDVI'; hmbtn.disabled = false; }, 2200); return; }
        const { image_base64, bounds } = await resp.json();
        const leafletBounds = [[bounds.south, bounds.west], [bounds.north, bounds.east]];
        heatmapLayer = L.imageOverlay('data:image/png;base64,' + image_base64, leafletBounds, { opacity: 0.8 }).addTo(map);
        heatmapOn = true; hmbtn.classList.add('on'); hmbtn.textContent = '🛰️ Masquer la carte NDVI'; hmbtn.disabled = false;
      } catch (err) {
        hmbtn.textContent = '🛰️ Erreur réseau'; console.error(err);
        setTimeout(() => { hmbtn.textContent = '🛰️ Afficher la carte NDVI'; hmbtn.disabled = false; }, 2200);
      }
    });

    map.on('click', async e => {
      const { lat, lng } = e.latlng; sp = { lat, lon: lng };
      abtn.disabled = true; resetHeatmap();
      if (pl) { map.removeLayer(pl); pl = null; } if (nl) { map.removeLayer(nl); nl = null; }
      hrow.style.display = 'flex'; pi.style.display = 'none'; nc.style.display = 'none';
      setStatus('Recherche à ' + lat.toFixed(4) + ', ' + lng.toFixed(4) + '…', 'active');
      try {
        const pd = await (await fetch('/parcel/resolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ point: { lat, lon: lng }, manual_geojson: null }) })).json();
        if (!pd.resolved || !pd.geometry) { setStatus(pd.warning || 'Aucune parcelle trouvée.', 'err'); return; }
        pl = L.geoJSON(pd.geometry, { style: { color: '#16a34a', weight: 3, fillColor: '#22c55e', fillOpacity: .18 } }).addTo(map);
        map.fitBounds(pl.getBounds(), { maxZoom: 17 });
        hrow.style.display = 'none'; pi.style.display = 'block';
        pid.textContent = pd.parcel_id ? 'Réf. ' + pd.parcel_id : 'Parcelle sélectionnée';
        isrc.textContent = SRC[pd.source] || pd.source;
        ibadge.innerHTML = '';
        ibadge.appendChild(badge(pd.is_agricultural === true ? 'bg' : pd.is_agricultural === false ? 'br' : 'bd',
          pd.is_agricultural === true ? '✓ Terre agricole (RPG)' : pd.is_agricultural === false ? '⚠️ Non déclarée RPG' : 'Statut inconnu'));
        if (pd.crop_declared) { icrow.style.display = 'flex'; icrp.textContent = pd.crop_declared; } else icrow.style.display = 'none';
        if (pd.area_ha != null) { iarow.style.display = 'flex'; iarea.textContent = pd.area_ha.toFixed(2) + ' ha'; } else iarow.style.display = 'none';
        abtn.disabled = false;
        hmbtn.style.display = 'flex';
        const nd = await (await fetch('/parcel/neighbors', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ point: { lat, lon: lng }, manual_geojson: null }) })).json();
        if (nd.neighbors && nd.neighbors.length) {
          nl = L.geoJSON(nd.neighbors.map(n => n.geometry), { style: { color: '#e65100', weight: 1, fillOpacity: .08, dashArray: '4' } }).addTo(map);
          nc.style.display = 'block'; nt.textContent = 'Cultures voisines — ' + nd.neighbor_count + ' parcelles (800 m)';
          nl2.innerHTML = '';
          Object.entries(nd.crop_distribution_pct).forEach(([nm, pct]) => {
            nl2.insertAdjacentHTML('beforeend', '<div class="cbar"><div class="cbar-head"><span class="cbar-name">' + nm + '</span><span class="cbar-pct">' + pct + '%</span></div><div class="cbar-track"><div class="cbar-fill" data-pct="' + pct + '" style="width:0%"></div></div></div>');
          });
          animBars();
        }
      } catch (err) { setStatus('Erreur réseau lors de la recherche.', 'err'); console.error(err); }
    });

    abtn.addEventListener('click', async () => {
      if (!sp) return;
      // Must call window.open() synchronously, in direct response to the
      // click, or browsers block it as a popup — can't wait for the
      // fetch to resolve first.
      const reportWin = window.open('', '_blank');
      if (!reportWin) {
        setStatus('Le navigateur a bloqué l\'ouverture d\'un nouvel onglet — autorisez les popups pour ce site.', 'err');
        return;
      }
      reportWin.document.write(reportPage('Rapport agronomique', 'Analyse en cours…', '<div id="lstate"><div class="spin"></div><p>Analyse en cours — génération du rapport…<br>Cela peut prendre quelques secondes.</p></div>'));
      reportWin.document.close();

      abtn.disabled = true;
      try {
        const resp = await fetch('/advise', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ point: sp, manual_geojson: null }) });
        const data = await resp.json();
        if (reportWin.closed) return; // user closed the tab before the report finished
        if (!resp.ok) {
          reportWin.document.open();
          reportWin.document.write(reportPage('Erreur', '', renderErr(data.detail || 'Erreur.')));
          reportWin.document.close();
          return;
        }
        const title = data.parcel_id ? 'Rapport — Réf. ' + data.parcel_id : 'Rapport agronomique';
        const subtitle = 'Généré le ' + new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        reportWin.document.open();
        reportWin.document.write(reportPage(title, subtitle, renderReport(data)));
        reportWin.document.close();
      } catch (err) {
        if (!reportWin.closed) {
          reportWin.document.open();
          reportWin.document.write(reportPage('Erreur', '', renderErr('Erreur réseau.')));
          reportWin.document.close();
        }
        console.error(err);
      }
      finally { abtn.disabled = false; }
    });

    /* ── STANDALONE REPORT-TAB DOCUMENT ──
       Builds a full, self-contained HTML page (own <style>, own tiny
       bar-animation script) so the report tab doesn't depend on
       anything from the map tab after document.write() runs. Only the
       CSS actually used by the render* functions below is duplicated
       here — kept in sync manually since it's generated, not shared,
       markup. */
    const REPORT_CSS = `
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      :root{--g900:#14532d;--g700:#15803d;--g600:#16a34a;--g500:#22c55e;--g100:#dcfce7;--g50:#f0fdf4;--r600:#dc2626;--r100:#fee2e2;--s100:#e0f2fe;--d900:#111827;--d800:#1f2937;--d700:#374151;--d600:#4b5563;--d400:#9ca3af;--d200:#e5e7eb;--d100:#f3f4f6;--d50:#f9fafb;--w:#fff;--r:12px;--rs:8px}
      html,body{font-family:'Inter',system-ui,sans-serif;background:var(--d100);color:var(--d800)}
      #page{max-width:820px;margin:0 auto;padding:28px 20px 64px}
      #phead{display:flex;align-items:center;gap:12px;margin-bottom:24px}
      #phead .bicon{width:42px;height:42px;background:linear-gradient(135deg,var(--g600),var(--g900));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
      #phead h2{font-size:19px;font-weight:700;color:var(--d900)}
      #phead p{font-size:13px;color:var(--d400);margin-top:2px}
      #lstate{text-align:center;padding:80px 20px}
      #lstate .spin{width:48px;height:48px;border:4px solid var(--d200);border-top-color:var(--g600);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
      #lstate p{color:var(--d400);font-size:14px;line-height:1.6}
      @keyframes spin{to{transform:rotate(360deg)}}
      .rsec{background:var(--w);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;border:1px solid var(--d200)}
      .rsh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
      .sico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
      .ico-s{background:#fef3c7}.ico-w{background:var(--s100)}.ico-v{background:#e0e7ff}.ico-c{background:var(--g100)}.ico-x{background:var(--r100)}.ico-n{background:var(--d100)}
      .stit{font-size:14px;font-weight:700;color:var(--d800)}
      .ssub{font-size:12px;color:var(--d400);margin-top:1px}
      .kvg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .kvi{background:var(--d50);border-radius:var(--rs);padding:12px 14px;border:1px solid var(--d200)}
      .kvl{font-size:11px;color:var(--d400);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
      .kvv{font-size:15px;font-weight:700;color:var(--d800)}
      .kvs{font-size:11px;color:var(--d600);margin-top:2px}
      .crec{margin-bottom:12px}.crec:last-child{margin-bottom:0}
      .crec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
      .crec-n{font-size:14px;font-weight:700;color:var(--d800);display:flex;align-items:center;gap:6px}
      .crnk{width:22px;height:22px;border-radius:50%;background:var(--g100);color:var(--g700);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
      .crnk.r1{background:#fef3c7;color:#b45309}
      .crsc{font-size:13px;font-weight:700;color:var(--g700)}
      .crrz{font-size:12px;color:var(--d400);margin-bottom:6px;line-height:1.5}
      .crt{height:8px;background:var(--d200);border-radius:99px;overflow:hidden}
      .crf{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.4,0,.2,1) .3s}
      .fg{background:linear-gradient(90deg,#f59e0b,#b45309)}.fv{background:linear-gradient(90deg,var(--g500),var(--g700))}.fd{background:linear-gradient(90deg,var(--d400),var(--d700))}
      .sclaim{background:var(--d50);border-left:3px solid var(--g500);border-radius:0 var(--rs) var(--rs) 0;padding:10px 14px;margin-bottom:8px;font-size:13px;color:var(--d700);line-height:1.6}
      .witem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--r100);border-radius:var(--rs);margin-bottom:8px;font-size:13px;color:#7f1d1d;line-height:1.5}
      .witem:last-child{margin-bottom:0}
      .prose{font-size:13px;color:var(--d600);line-height:1.7}
      .prose strong{color:var(--d800);font-weight:700}
    `;

    function reportPage(title, subtitle, bodyHtml) {
      return '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
        '<title>' + title + ' — Agri Advisor IA</title>' +
        '<link rel="preconnect" href="https://fonts.googleapis.com">' +
        '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
        '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">' +
        '<style>' + REPORT_CSS + '</style></head><body>' +
        '<div id="page"><div id="phead"><div class="bicon">🌾</div><div><h2>' + title + '</h2>' + (subtitle ? '<p>' + subtitle + '</p>' : '') + '</div></div>' +
        '<div id="pbody">' + bodyHtml + '</div></div>' +
        '<script>requestAnimationFrame(() => document.querySelectorAll(\'[data-pct]\').forEach(e => e.style.width = e.dataset.pct + \'%\'));</' + 'script>' +
        '</body></html>';
    }

    /* ── RENDERERS ── */
    function renderReport(d) {
      const md = d.report_markdown || '', w = d.warnings || [], uf = d.unverified_figures || [];
      const secs = parseSections(md); let h = '';
      secs.forEach(s => {
        if (s.type === 'summary') h += renderSummary(s);
        else if (s.type === 'soil') h += renderSoil(s);
        else if (s.type === 'weather') h += renderWeather(s);
        else if (s.type === 'vegetation') h += renderVegetation(s);
        else if (s.type === 'crops') h += renderCrops(s);
        else if (s.type === 'claims') h += renderClaims(s);
        else h += renderGeneric(s);
      });
      if (w.length) h += renderWarns(w);
      if (uf.length) h += renderUnverified(uf);
      return h || renderFallback(md);
    }

    function renderUnverified(uf) {
      return section('ico-x', '🚩', 'Chiffres non vérifiés', 'Ces valeurs apparaissent sans correspondre aux données sources — à vérifier manuellement',
        uf.map(n => '<div class="witem"><span>🚩</span><span>' + n + '</span></div>').join(''), true);
    }

    function parseSections(md) {
      // Split on "## " / "### " / "#### " headings — Stage 2 is now
      // prompted to use real "## " top-level headings consistently, but
      // this stays permissive (2-4 hashes) as a safety net for any
      // report generated before/without that prompt update.
      const parts = md.split(/\n(?=#{2,4}\s)/g);
      const out = [];
      parts.forEach(p => {
        const ls = p.trim().split('\n');
        let hd = ls[0].replace(/^#+\s*/, '').replace(/\*\*/g, '').trim();
        let body = ls.slice(1).join('\n').trim();
        if (!hd && !body) return;
        if (!hd) { hd = 'Résumé'; body = p.trim(); }
        const hl = hd.toLowerCase();
        let type = 'generic';
        if (/r.sum.|parcelle/i.test(hl)) type = 'summary';
        else if (/sol|pedol|texture|ph|mati.re|argile|limon|sable|azote/i.test(hl)) type = 'soil';
        else if (/m.t.o|temp.r|pr.cip|climat|hydrique/i.test(hl)) type = 'weather';
        else if (/v.g.tation|ndvi|satellite/i.test(hl)) type = 'vegetation';
        else if (/culture|recommand|pertinence|score/i.test(hl)) type = 'crops';
        else if (/pratique|bonne|conseil|source|fond./i.test(hl)) type = 'claims';
        out.push({ type, heading: hd, body });
      });
      return out;
    }

    function renderSummary(s) { return section('ico-n', '📐', s.heading, 'Informations générales sur la parcelle', kvGrid(s.body) + prose(s.body, true)); }
    function renderSoil(s) { return section('ico-s', '🌍', s.heading, 'Analyse physico-chimique du sol', kvGrid(s.body) + prose(s.body, true)); }
    function renderWeather(s) { return section('ico-w', '⛅', s.heading, 'Données météorologiques récentes', kvGrid(s.body) + prose(s.body, true)); }
    function renderVegetation(s) { return section('ico-v', '🛰️', s.heading, 'Indice de végétation (NDVI) par satellite', kvGrid(s.body) + prose(s.body, true)); }
    function renderGeneric(s) { return section('ico-n', '📋', s.heading, '', fmtProse(s.body)); }
    function renderClaims(s) {
      const bs = s.body.split('\n').map(l => l.replace(/^[-*•]\s*/, '').trim()).filter(l => l.length > 8);
      return section('ico-n', '📚', s.heading, 'Recommandations fondées sur des sources scientifiques',
        bs.map(b => '<div class="sclaim">' + fmtProse(b) + '</div>').join('') || fmtProse(s.body));
    }
    function renderCrops(s) {
      const rows = [];
      // Try table-row parsing first (legacy format)
      s.body.split('\n').forEach(l => {
        const cs = l.split('|').map(c => c.trim()).filter(Boolean);
        if (cs.length >= 2 && !l.includes('---') && !/culture|score/i.test(l)) rows.push({ name: cs[0], score: parseFloat(cs[1]) || 0, reason: cs[2] || '' });
      });
      // Fallback: "### N. Nom" + "**Score : NN%**" + reasoning line format
      if (!rows.length) {
        const blocks = s.body.split(/\n(?=#{3}\s*\d)/g);
        blocks.forEach(b => {
          const nameMatch = b.match(/#{3}\s*\d+\.\s*(.+)/);
          const scoreMatch = b.match(/Score\s*:\s*(\d+(?:[.,]\d+)?)\s*%/i);
          if (nameMatch) {
            const name = nameMatch[1].replace(/\*\*/g, '').trim();
            const score = scoreMatch ? parseFloat(scoreMatch[1].replace(',', '.')) / 100 : 0;
            const reason = b.replace(/#{3}\s*\d+\.\s*.+/, '').replace(/\*\*Score\s*:.+?\*\*/i, '').trim();
            rows.push({ name, score, reason });
          }
        });
      }
      let h = '';
      if (rows.length) {
        rows.forEach((r, i) => {
          const pct = Math.round(r.score * 100), fc = i === 0 ? 'fg' : r.score > 0.7 ? 'fv' : 'fd', rk = i === 0 ? 'r1' : '';
          h += '<div class="crec"><div class="crec-h"><div class="crec-n"><div class="crnk ' + rk + '">' + (i + 1) + '</div>' + r.name + '</div><div class="crsc">' + pct + '%</div></div>' + (r.reason ? '<div class="crrz">' + fmtProse(r.reason) + '</div>' : '') + '<div class="crt"><div class="crf ' + fc + '" data-pct="' + pct + '" style="width:0%"></div></div></div>';
        });
      } else h = '<div class="prose">' + fmtProse(s.body) + '</div>';
      return section('ico-c', '🌿', s.heading, 'Classées par score de pertinence (0–100 %)', h);
    }
    function renderWarns(ws) {
      return section('ico-x', '🔔', 'Avertissements', 'Données manquantes ou lacunes identifiées',
        ws.map(w => '<div class="witem"><span>⚠️</span><span>' + w + '</span></div>').join(''), true);
    }
    function renderErr(m) { return section('ico-x', '❌', 'Erreur', '', m, true); }
    function renderFallback(md) { return '<div class="rsec"><div class="prose">' + fmtProse(md) + '</div></div>'; }

    function section(ico, em, title, sub, body, warn = false) {
      return '<div class="rsec"' + (warn ? ' style="border-color:#fecaca"' : '') + '>' +
        '<div class="rsh"><div class="sico ' + ico + '">' + em + '</div><div><div class="stit">' + title + '</div>' + (sub ? '<div class="ssub">' + sub + '</div>' : '') + '</div></div>' +
        body + '</div>';
    }
    function kvGrid(body) {
      const kvs = extractKV(body);
      if (!kvs.length) return '';
      return '<div class="kvg">' + kvs.map(k => '<div class="kvi"><div class="kvl">' + k.key + '</div><div class="kvv">' + k.val + '</div>' + (k.note ? '<div class="kvs">' + k.note + '</div>' : '') + ' </div>').join('') + '</div>';
    }
    function prose(body, skipKV = false) {
      if (!skipKV) return '<div class="prose">' + fmtProse(body) + '</div>';
      const lines = body.split('\n').filter(l => !l.match(/^[-*]\s*[^:]+:/) && l.trim().length > 30).join('\n').trim();
      return lines ? '<div class="prose" style="margin-top:12px">' + fmtProse(lines) + '</div>' : '';
    }
    function fmtProse(t) {
      return '<p>' + t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/\n{2,}/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
    }
    function extractKV(body) {
      const kvs = []; const re = /[-*]\s*\*{0,2}([^:*\n]+)\*{0,2}\s*:\s*\*{0,2}([^(\n]{1,60})\*{0,2}(?:\s*[\(（]([^)\n）]{1,80})[\)）])?/g;
      let m;
      while ((m = re.exec(body)) !== null) {
        const k = m[1].replace(/\*/g, '').trim(), v = m[2].replace(/\*/g, '').trim(), n = m[3] ? m[3].trim() : '';
        if (k.length < 40 && v.length < 60) kvs.push({ key: k, val: v, note: n });
      }
      return kvs;
    }
  </script>
</body>
